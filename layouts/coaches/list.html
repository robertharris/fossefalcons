{{ define "main" }}
<article class="container prose">
  <h1>{{ .Title }}</h1>
  {{ .Content }}
  <div class="coach-profiles">
    {{ range .Pages.ByWeight }}
    <section class="coach-profile" aria-labelledby="coach-{{ .Title | urlize }}">
      <div class="coach-photo">
        <img src="{{ .Params.photo | relURL }}" alt="{{ .Params.photo_alt }}" width="480" height="480" loading="lazy">
      </div>
      <h2 id="coach-{{ .Title | urlize }}"><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
      <p>{{ .Summary | plainify | truncate 120 }}</p>
    </section>
    {{ end }}
  </div>
</article>
{{ end }}
