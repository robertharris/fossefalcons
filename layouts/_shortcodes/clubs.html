<ul class="club-list">
  {{ range site.Data.clubs }}
  <li>
    <a href="{{ .url }}" target="_blank" rel="noopener noreferrer">
      <span class="club-logo">{{ with .logo }}<img src="{{ . }}" alt="" loading="lazy">{{ else }}<span class="club-initials" aria-hidden="true">{{ range (split .name " ") }}{{ substr . 0 1 }}{{ end }}</span>{{ end }}</span>
      <span class="club-name">{{ .name }}</span>
    </a>
  </li>
  {{ end }}
</ul>
