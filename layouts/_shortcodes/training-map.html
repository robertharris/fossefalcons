{{ $locations := site.Data.training_locations }}
<link rel="stylesheet" href="{{ "vendor/leaflet/leaflet.css" | relURL }}">
<div id="training-map" role="region" aria-label="Map of training locations" style="height:400px;margin:1rem 0"></div>
<ul class="training-locations">
  {{ range $locations }}
  <li><strong>{{ .name }}</strong>, {{ .address }} (<a href="https://www.openstreetmap.org/search?query={{ .address | urlquery }}" target="_blank" rel="noopener noreferrer">map</a>)</li>
  {{ end }}
</ul>
<script src="{{ "vendor/leaflet/leaflet.js" | relURL }}"></script>
<script>
  (function () {
    var locations = {{ $locations | jsonify | safeJS }};
    var map = L.map('training-map', { scrollWheelZoom: false });
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);
    var points = locations.map(function (l) {
      var popup = document.createElement('div');
      var title = document.createElement('strong');
      title.textContent = l.name;
      popup.appendChild(title);
      popup.appendChild(document.createElement('br'));
      popup.appendChild(document.createTextNode(l.address));
      L.marker([l.lat, l.lng]).addTo(map).bindPopup(popup);
      return [l.lat, l.lng];
    });
    map.fitBounds(points, { padding: [30, 30] });
  })();
</script>
